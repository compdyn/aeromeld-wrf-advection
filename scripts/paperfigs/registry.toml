# Models and WRF-ML runs. See paperfigs/registry.py for the rules.
#
# Hand-typed:  label, family, notes (models); role, notes (runs); [sets]
# Derived:     n_latent, emission_rate -- written by register_runs.py from the
#              run's files and re-checked on use. Never edit them by hand.
#
# role: main (exactly one; makes the paper's single-model figures) |
#       appendix | exploratory | superseded
#
# New runs:  python register_runs.py --write   (then edit the stubs it appends)

